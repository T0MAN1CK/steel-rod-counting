[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-rod-counting"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.11.0", "torchvision==0.26.0",
  "segmentation-models-pytorch==0.5.0", "numpy==2.5.2",
  "scipy==1.18.1", "Pillow==12.3.0",
]

[project.scripts]
rod-train = "rod_counting.train:main"

[tool.setuptools.packages.find]
where = ["src"]
